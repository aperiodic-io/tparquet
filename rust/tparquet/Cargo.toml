[package]
name = "tparquet"
version = "1.0.0"
description = "Parquet files with the PCODEC codec: writer with automatic codec selection, transcoding, and the tparquet CLI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["parquet", "pcodec", "compression", "arrow", "time-series"]
categories = ["compression", "encoding", "command-line-utilities"]
default-run = "tparquet"
# published on crates.io (scripts/check-publish.sh): gen-testdata and the tests need this
# repository's testdata/, so the package has only the library and the tparquet CLI
exclude = ["src/bin/gen-testdata", "tests"]

[dependencies]
parquet = { workspace = true, features = ["arrow", "zstd", "snap", "lz4", "brotli", "flate2-zlib-rs", "pcodec"] }
tparquet-core = { version = "1.0.0", path = "../core" }
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-buffer.workspace = true
arrow-select.workspace = true
bytes = "1"
base64 = "0.23"
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
# gen-testdata: the hand-made payload vectors (a pcodec file without numbers, an empty frame)
pco.workspace = true
zstd.workspace = true

[dev-dependencies]
# the tests also read with the async reader and write and read encrypted files
parquet = { workspace = true, features = ["async", "encryption"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
proptest.workspace = true
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[bin]]
name = "tparquet"
path = "src/bin/tparquet.rs"

[[bin]]
name = "gen-testdata"
path = "src/bin/gen-testdata/main.rs"
