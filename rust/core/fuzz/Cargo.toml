[package]
name = "tparquet-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tparquet-core = { path = ".." }
# the version the core uses (root Cargo.toml), for differential targets
pco = "=1.0.4"

# not part of the root workspace: built only with `cargo +nightly fuzz`
[workspace]

[[bin]]
name = "decompress"
path = "fuzz_targets/decompress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structured"
path = "fuzz_targets/structured.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decimal_roundtrip"
path = "fuzz_targets/decimal_roundtrip.rs"
test = false
doc = false
bench = false
