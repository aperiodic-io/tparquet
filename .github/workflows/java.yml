name: java

# The JVM packages (java/): the JNI binding, the parquet-java fork, the tparquet library, the
# Spark data source, and the upstream-refusal acceptance test.
on:
  push:
    branches: [main]
    paths:
      - "java/**"
      - "!java/pcodec/**" # its own workflow, pcodec-java.yml
      - "rust/core/**"
      - "rust/jni/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "testdata/**"
      - "scripts/check-fork-java.sh"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "java/**"
      - "!java/pcodec/**" # its own workflow, pcodec-java.yml
      - "rust/core/**"
      - "rust/jni/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "testdata/**"
      - "scripts/check-fork-java.sh"
      - ".github/workflows/java.yml"
  schedule:
    - cron: "17 5 * * 3" # weekly: upstream's suite against the fork, and mutation testing
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch or pull request cancels the runs it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    runs-on: ubicloud-standard-4
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: the fork is upstream parquet-java 1.17.0 + FORK.patch
        run: scripts/check-fork-java.sh
      - name: build and test every module
        run: make -C java test
      - name: the JNI crate's Rust tests, and its native methods through the Java suite
        run: TPARQUET_MAVEN=$(command -v mvn) cargo test -p tparquet-jni
      - name: the vectors CLI on the repository's vectors
        run: make -C java vectors ARGS="check $GITHUB_WORKSPACE/testdata"

  upstream-suite:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubicloud-standard-4
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: upstream parquet-java's suite gives the fork the outcomes it gives upstream
        run: make -C java fork-upstream-tests

  mutation:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubicloud-standard-4
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-mutants@27
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: PIT on the Java code (every mutant killed)
        run: make -C java mutants
      - name: cargo mutants on rust/jni, judged by the Java suite
        run: make -C java jni-mutants
