name: bench

on:
  push:
    branches: [main]
    paths:
      - "bench/**"
      - "python/**"
      - "rust/core/**"
      - "rust/parquet/**"
      - "rust/tparquet/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "testdata/**"
      - ".cargo/**"
      - ".github/workflows/bench.yml"
  pull_request:
    paths:
      - "bench/**"
      - "python/**"
      - "rust/core/**"
      - "rust/parquet/**"
      - "rust/tparquet/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "testdata/**"
      - ".cargo/**"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch or pull request cancels the runs it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  UV_PYTHON_PREFERENCE: only-managed

# The benchmark harness (bench/): lint, its offline tests and mutmut. The benchmark itself downloads
# about 1.2 GB of provider samples and is run by hand (`make bench`).
jobs:
  check:
    runs-on: ubicloud-standard-4
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: uv sync --locked --python 3.14
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest

  mutmut:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubicloud-standard-4
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: uv sync --locked --python 3.14
      - name: mutmut (fails on any mutant that is not killed)
        run: uv run --no-sync python scripts/mutmut_check.py
