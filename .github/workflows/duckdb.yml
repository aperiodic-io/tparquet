name: duckdb

# The DuckDB extension: DuckDB's own parquet extension with the PCODEC codec, a patch over each
# DuckDB release (duckdb/FORK.md), built and tested for each DuckDB version.

on:
  push:
    branches: [main]
    paths:
      - "duckdb/**"
      - "rust/core/**"
      - "rust/capi/**"
      - "rust/tparquet/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "testdata/**"
      - "scripts/check-duckdb-fork.sh"
      - ".github/workflows/duckdb.yml"
  pull_request:
    paths:
      - "duckdb/**"
      - "rust/core/**"
      - "rust/capi/**"
      - "rust/tparquet/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "testdata/**"
      - "scripts/check-duckdb-fork.sh"
      - ".github/workflows/duckdb.yml"
  schedule:
    - cron: "41 4 * * 2" # weekly mutation run of the patch
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch or pull request cancels the runs it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CCACHE_DIR: ${{ github.workspace }}/target/ccache
  CCACHE_MAXSIZE: 2G

jobs:
  check-fork:
    runs-on: ubuntu-standard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-duckdb-fork.sh

  test:
    runs-on: ubuntu-standard
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ["1.5.6", "2.0.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y ninja-build ccache
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # the DuckDB source distribution and ccache, per version and patch
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            target/duckdb/dl
            target/ccache
          key: duckdb-${{ matrix.version }}-${{ hashFiles(format('duckdb/{0}.patch', matrix.version), 'duckdb/build.sh') }}
          restore-keys: duckdb-${{ matrix.version }}-
      - name: install uv 0.11.32 (hash-pinned)
        run: |
          printf 'uv==0.11.32 --hash=sha256:3da76cd4e2697de30928b8a8524bd39183ac1e08cb7e72833807c022b7cba6c4\n' > "$RUNNER_TEMP/uv.txt"
          python3 -m pip install --user --require-hashes -r "$RUNNER_TEMP/uv.txt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cd duckdb && uv sync --locked --python 3.14
      - name: build the extension for DuckDB ${{ matrix.version }} and run the tests with its Python duckdb
        run: make -C duckdb test VERSIONS=${{ matrix.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tparquet-duckdb-v${{ matrix.version }}-linux_amd64
          path: duckdb/build/v${{ matrix.version }}/tparquet.duckdb_extension
          if-no-files-found: error

  # the scripted mutants of the patch (duckdb/mutation): each rebuilds the extension and runs the
  # tests
  mutation:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-standard
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y ninja-build ccache
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            target/duckdb/dl
            target/ccache
          key: duckdb-2.0.0-${{ hashFiles('duckdb/2.0.0.patch', 'duckdb/build.sh') }}
          restore-keys: duckdb-2.0.0-
      - name: install uv 0.11.32 (hash-pinned)
        run: |
          printf 'uv==0.11.32 --hash=sha256:3da76cd4e2697de30928b8a8524bd39183ac1e08cb7e72833807c022b7cba6c4\n' > "$RUNNER_TEMP/uv.txt"
          python3 -m pip install --user --require-hashes -r "$RUNNER_TEMP/uv.txt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cd duckdb && uv sync --locked --python 3.14
      - run: make -C duckdb mutation MUTATION_VERSION=2.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: mutation-duckdb.out
          path: target/duckdb/2.0.0/mutation.out
