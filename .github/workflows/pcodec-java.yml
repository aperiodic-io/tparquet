name: pcodec-java

# The pure Java pcodec (java/pcodec): its tests against the Rust reference (pco 1.0.4 and
# tparquet-core, through java/pcodec/oracle), the golden vectors, and the proofs. Local
# equivalents: java/pcodec/Makefile. VERIFICATION.md explains what each job establishes.
# Every job runs on the `ubuntu-standard` runners.
on:
  push:
    branches: [main]
    paths:
      - "java/pcodec/**"
      - "rust/core/**"
      - "testdata/payloads/**"
      - ".github/workflows/pcodec-java.yml"
  pull_request:
    paths:
      - "java/pcodec/**"
      - "rust/core/**"
      - "testdata/payloads/**"
      - ".github/workflows/pcodec-java.yml"
  schedule:
    - cron: "41 4 * * 3" # weekly: the parity suites at 8x scale, and mutation testing
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch or pull request cancels the runs it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  parity:
    runs-on: ubuntu-standard
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: java/pcodec/oracle
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: the reference oracle (pco 1.0.4, tparquet-core), and the traced one
        run: make -C java/pcodec oracle
      - name: every suite against the reference (byte parity, decoder parity, exhaustive domains, libm)
        run: make -C java/pcodec parity SCALE=${{ github.event_name == 'schedule' && 8 || 1 }}
      - name: the golden vectors are what the reference answers today
        run: make -C java/pcodec vectors-check

  # the library without Rust: Java 11 bytecode on the oldest JDK parquet-java supports, and
  # the tests that need no oracle (unit tests, round trips, testdata/payloads, golden vectors)
  standalone:
    runs-on: ubuntu-standard
    timeout-minutes: 30
    strategy:
      matrix:
        java: ["11", "17", "21"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            21
          cache: maven
      - name: build with JDK 21, run the oracle-free tests on JDK ${{ matrix.java }}
        run: |
          make -C java/pcodec test MVN="mvn -B -Djvm=$JAVA_HOME_${{ matrix.java }}_X64/bin/java"
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

  proofs:
    runs-on: ubuntu-standard
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: z3
        run: pip install z3-solver==4.13.0.0
      - name: the SMT proofs
        run: make -C java/pcodec proofs

  mutation:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-standard
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: PIT on the library, judged by the suites that need no oracle (threshold in pom.xml)
        run: make -C java/pcodec mutants
