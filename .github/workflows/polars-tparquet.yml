name: polars-tparquet

on:
  push:
    branches: [main]
    paths:
      - "polars-tparquet/**"
      - "python/**"
      - "rust/core/**"
      - "rust/parquet/**"
      - "rust/tparquet/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "testdata/**"
      - ".cargo/**"
      - ".github/workflows/polars-tparquet.yml"
  pull_request:
    paths:
      - "polars-tparquet/**"
      - "python/**"
      - "rust/core/**"
      - "rust/parquet/**"
      - "rust/tparquet/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "testdata/**"
      - ".cargo/**"
      - ".github/workflows/polars-tparquet.yml"
  schedule:
    - cron: "17 5 * * 2" # weekly: thorough property tests
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch or pull request cancels the runs it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  UV_PYTHON_PREFERENCE: only-managed

# Every job builds tparquet from ../python (maturin), hence the Rust toolchain and cache.
jobs:
  lint:
    runs-on: ubicloud-standard-4
    defaults:
      run:
        working-directory: polars-tparquet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: uv sync --locked --python 3.14
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync mypy

  test:
    runs-on: ubicloud-standard-4
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: polars-tparquet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: polars-tparquet-${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --no-sync pytest
        env:
          HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'thorough' || 'default' }}

  mutmut:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubicloud-standard-4
    timeout-minutes: 60
    defaults:
      run:
        working-directory: polars-tparquet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: uv sync --locked --python 3.14
      - name: mutmut (fails on any mutant that is not killed)
        run: uv run --no-sync python scripts/mutmut_check.py
        env:
          HYPOTHESIS_PROFILE: mutation
          TPARQUET_TESTDATA: ${{ github.workspace }}/testdata

  build:
    runs-on: ubicloud-standard-4
    defaults:
      run:
        working-directory: polars-tparquet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # a pure-Python wheel and an sdist; tparquet is a dependency, not bundled
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polars-tparquet-dist
          path: polars-tparquet/dist
