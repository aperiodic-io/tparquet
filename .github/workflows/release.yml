name: release

# Publishes a release: push a tag vX.Y.Z (the version of tparquet-core, tparquet, the Python
# package and polars-tparquet; scripts/check-publish.sh checks they agree).
#
#   crates.io  tparquet-core, tparquet-parquet, tparquet (scripts/publish-crates.sh), with the
#              CARGO_REGISTRY_TOKEN secret
#   PyPI       tparquet (abi3 wheels for Linux, macOS and Windows, and the sdist) and
#              polars-tparquet, with the PYPI_TOKEN secret
#
# Run it by hand (Actions, release, Run workflow) to build and check everything without
# publishing: only a tag push publishes. Versions already on crates.io or PyPI are skipped, so a
# failed release can be run again.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # the versions agree with each other (and with the tag), and the crates package and build
      - env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/check-publish.sh ${TAG:+"$TAG"}

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: build the abi3 wheel (CPython >= 3.10)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --manifest-path python/Cargo.toml
      # the wheel installs and reads a conformance vector, on the platform it was built for
      # (-I: the installed package, never the checkout)
      - name: smoke test
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist tparquet
          python -m pip install pyarrow
          python -I -c "import sys, tparquet; t = tparquet.read_table(sys.argv[1]); assert t.num_rows == 1500, t.num_rows; print(tparquet.__file__, t.num_rows)" \
            testdata/files/mixed.parquet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path python/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  polars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build polars-tparquet --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-polars-tparquet
          path: dist/*
          if-no-files-found: error

  crates-io:
    if: github.ref_type == 'tag'
    needs: [check, wheels, sdist, polars]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh

  pypi:
    if: github.ref_type == 'tag'
    needs: [check, wheels, sdist, polars]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: ls -l dist
      # --check-url: files PyPI already has are skipped, so the job can be run again
      - env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ dist/*
