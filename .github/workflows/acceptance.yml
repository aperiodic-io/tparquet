name: acceptance

# Cross-language acceptance (acceptance/cross/run.sh): the vectors written by Rust, Go, the
# Python package, the DuckDB extension, Java and C++, each read by all six.
on:
  push:
    branches: [main]
    paths-ignore:
      - "bench/**"
      - "polars-tparquet/**"
      - "trino/**"
      - "brand/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "bench/**"
      - "polars-tparquet/**"
      - "trino/**"
      - "brand/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch or pull request cancels the runs it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CCACHE_DIR: ${{ github.workspace }}/target/ccache
  # the C++ library's build dependencies (as .github/workflows/cpp.yml)
  APT_PACKAGES: >-
    cmake ninja-build ccache thrift-compiler libthrift-dev libzstd-dev libsnappy-dev
    liblz4-dev libbrotli-dev zlib1g-dev liburiparser-dev rapidjson-dev libgtest-dev
    libgmock-dev libboost-dev clang libclang-rt-18-dev

jobs:
  cross:
    runs-on: ubuntu-standard
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y $APT_PACKAGES
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: the Python package (python/.venv)
        working-directory: python
        run: |
          uv sync --locked --python 3.14
          uv run --no-sync maturin develop --uv
      # the DuckDB fork's build of the DuckDB that python/.venv has (acceptance/cross/run.sh), with
      # duckdb.yml's cache
      - name: the DuckDB version of python/.venv
        id: duckdb
        run: echo "version=$(python/.venv/bin/python -c 'import duckdb; print(duckdb.__version__)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            target/duckdb/dl
            target/ccache
          key: duckdb-${{ steps.duckdb.outputs.version }}-${{ hashFiles(format('duckdb/{0}.patch', steps.duckdb.outputs.version), 'duckdb/build.sh') }}
          restore-keys: duckdb-${{ steps.duckdb.outputs.version }}-
      - name: the DuckDB extension
        run: make -C duckdb build VERSIONS=${{ steps.duckdb.outputs.version }} JOBS=4
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: the Java packages
        run: make -C java install
      # the Arrow C++ fork's build, shared with cpp.yml's key
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            target/cpp/dl
            target/cpp/deps
            target/cpp/arrow-src
            target/cpp/arrow-release
            target/ccache
          key: cpp-arrow-release-${{ runner.os }}-${{ hashFiles('cpp/arrow/**') }}
          restore-keys: cpp-arrow-release-${{ runner.os }}-
      - name: the C++ library and its CLI
        run: make -C cpp build JOBS=4
      - run: make acceptance
