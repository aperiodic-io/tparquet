name: trino

# Trino (trino/): the trino-parquet 484 fork, Trino's reader and query engine on tparquet files,
# the plugin install script, unmodified Trino's refusal. The reactor builds with JDK 25 (Trino
# 484); the java/ modules it depends on (tparquet-jni, the parquet-java 1.18.1 fork, tparquet)
# with JDK 21.
on:
  push:
    branches: [main]
    paths:
      - "trino/**"
      - "java/pom.xml"
      - "java/tparquet-jni/**"
      - "java/parquet-java/**"
      - "java/parquet-java-1.18/**"
      - "java/tparquet/**"
      - "rust/core/**"
      - "rust/jni/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "testdata/**"
      - "scripts/check-fork-java.sh"
      - ".github/workflows/trino.yml"
  pull_request:
    paths:
      - "trino/**"
      - "java/pom.xml"
      - "java/tparquet-jni/**"
      - "java/parquet-java/**"
      - "java/parquet-java-1.18/**"
      - "java/tparquet/**"
      - "rust/core/**"
      - "rust/jni/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "testdata/**"
      - "scripts/check-fork-java.sh"
      - ".github/workflows/trino.yml"
  schedule:
    - cron: "17 5 * * 4" # weekly: mutation testing
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch or pull request cancels the runs it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    runs-on: ubuntu-standard
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: maven
      - name: the forks are upstream trino-parquet 484 and parquet-java 1.18.1 + FORK.patch
        run: scripts/check-fork-java.sh trino/trino-parquet java/parquet-java-1.18
      - name: build and test every module
        run: make -C trino test JAVA_HOME_JAVA="$JAVA_HOME_21_X64" JAVA_HOME_TRINO="$JAVA_HOME_25_X64"

  mutation:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-standard
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: maven
      - name: PIT on the fork's code (every mutant killed)
        run: make -C trino mutants JAVA_HOME_JAVA="$JAVA_HOME_21_X64" JAVA_HOME_TRINO="$JAVA_HOME_25_X64"
